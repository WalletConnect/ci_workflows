name: App - Check

on:
  workflow_call:
    inputs:
      test-args:
        description: 'The arguments to pass to the test command'
        type: string
        default: '--all-features --lib --bins'
      test-suites:
        description: 'Extra test suites to run'
        type: string
        default: ''
      rust-toolchain:
        description: 'The Rust version to use'
        type: string
        default: 'stable'
      rust-toolchain-formatting:
        description: 'The Rust version to use to check formatting'
        type: string
        default: 'stable'
      rust-toolchain-udeps:
        description: 'The Rust version to use to run udeps'
        type: string
        default: 'nightly'
      check-udeps:
        description: Enable checking for unusued dependencies
        type: boolean
        default: true
      rust-backtrace:
        description: 'The Rust backtrace settings'
        type: string
        default: 'full'
      install-protoc:
        description: 'Install protoc before running tests'
        type: boolean
        default: true
      use-sccache:
        # DEPRECATED / no-op: sccache had no persistent backend configured here
        # (its object store was never cached), so it provided no cross-run
        # benefit and disabled incremental compilation, which fights the
        # Swatinem/rust-cache target/ cache. The input is kept so existing
        # callers (and ci.yml) don't break; it no longer wires anything.
        description: '(deprecated, no-op) Run sccache-cache before running tests'
        type: boolean
        default: true
      use-mold:
        # Opt-in (default false): mold is a linker, so it only helps jobs that
        # link a binary — i.e. tests / tests-suites, not clippy (check-only) or
        # fmt (no compile). Keep this OFF for `cargo test --release` / LTO test
        # builds: mold can't read ThinLTO bitcode objects without the LLVM
        # plugin and the final link fails.
        description: 'Use the mold linker (clang driver) for the test jobs. Only for non-LTO debug test builds.'
        type: boolean
        default: false
      use-postgresql:
        description: 'Run postgresql before running tests'
        type: boolean
        default: false
      test-env-vars:
        description: 'The environment variables to set for the tests'
        type: string
        default: ''
      run-label:
        description: 'The run label to use for the actions'
        type: string
        default: 'ubuntu-latest'
      run-label-light:
        description: 'Runner for jobs that never compile the workspace (Formatting, Licenses). These jobs gain nothing from a larger runner: `cargo fmt -- --check` only parses, and cargo-deny runs a prebuilt binary against cargo metadata.'
        type: string
        default: 'ubuntu-latest'
      rust-cache-prefix:
        description: 'Prefix for Rust cache key (bump to invalidate all caches)'
        type: string
        default: 'v0-rust'
      rust-cache-save:
        description: 'Whether to save the Rust cache (set to false for PRs to only restore from main)'
        type: boolean
        default: true
    secrets:
      PRIVATE_SUBMODULE_ACCESS_TOKEN:
        required: false
        description: 'Optional token for checking out private submodules (falls back to github.token).'
      CARGO_GIT_SSH_KEY:
        required: false
        description: 'Optional SSH private key (e.g. a read-only deploy key) for fetching private git dependencies over SSH. When empty, nothing changes.'

env:
  RUST_BACKTRACE: ${{ inputs.rust-backtrace }}
  # 'true' when the caller provides CARGO_GIT_SSH_KEY. Secrets can't be used in
  # `if:`, so steps test this flag instead. It holds only a boolean, never the key.
  HAS_CARGO_GIT_SSH_KEY: ${{ secrets.CARGO_GIT_SSH_KEY != '' }}

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy
    runs-on: ${{ inputs.run-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_ACCESS_TOKEN || github.token }}
          submodules: recursive

      # Opt-in (only when the caller provides CARGO_GIT_SSH_KEY): load the key into
      # an ssh-agent so private git dependencies can be fetched over SSH.
      - name: Load SSH key for private git dependencies
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.CARGO_GIT_SSH_KEY }}

      # Have cargo fetch git deps with the git CLI, which uses the ssh-agent and
      # known_hosts set up above. Set before Rust cache, whose `cargo metadata`
      # resolves git deps and whose cache key includes CARGO_* env vars.
      - name: Fetch git dependencies with the git CLI
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install Rust ${{ inputs.rust-toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          prefix-key: ${{ inputs.rust-cache-prefix }}
          shared-key: clippy
          save-if: ${{ inputs.rust-cache-save }}

      - name: Install Protoc
        if: ${{ inputs.install-protoc == true }}
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  formatting:
    name: Formatting
    runs-on: ${{ inputs.run-label-light }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_ACCESS_TOKEN || github.token }}
          submodules: recursive
      - name: Install Rust ${{ inputs.rust-toolchain-formatting }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain-formatting }}
          components: rustfmt

      # `cargo fmt -- --check` does not compile anything, so there is no target/
      # or dependency cache to restore here.
      - name: Check Formatting
        run: cargo fmt -- --check

  tests:
    name: Unit Tests
    runs-on: ${{ inputs.run-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_ACCESS_TOKEN || github.token }}
          submodules: recursive

      # Opt-in (only when the caller provides CARGO_GIT_SSH_KEY): load the key into
      # an ssh-agent so private git dependencies can be fetched over SSH.
      - name: Load SSH key for private git dependencies
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.CARGO_GIT_SSH_KEY }}

      # Have cargo fetch git deps with the git CLI, which uses the ssh-agent and
      # known_hosts set up above. Set before Rust cache, whose `cargo metadata`
      # resolves git deps and whose cache key includes CARGO_* env vars.
      - name: Fetch git dependencies with the git CLI
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install Rust ${{ inputs.rust-toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      # Before the cache step so RUSTFLAGS is part of the Swatinem cache key.
      - name: Set up mold linker
        if: ${{ inputs.use-mold }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mold clang
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C linker=clang -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          prefix-key: ${{ inputs.rust-cache-prefix }}
          shared-key: tests
          save-if: ${{ inputs.rust-cache-save }}

      - name: Install Protoc
        if: ${{ inputs.install-protoc == true }}
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit Tests
        run: cargo test ${{ inputs.test-args }}

  tests-suites:
    name: Tests Suite "${{ matrix.element }}"
    if: (inputs.test-suites != '') && (inputs.test-suites != '[]')
    strategy:
      fail-fast: false
      matrix:
        element: ${{ fromJson(inputs.test-suites) }}
    runs-on: ${{ inputs.run-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_ACCESS_TOKEN || github.token }}
          submodules: recursive

      # Opt-in (only when the caller provides CARGO_GIT_SSH_KEY): load the key into
      # an ssh-agent so private git dependencies can be fetched over SSH.
      - name: Load SSH key for private git dependencies
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.CARGO_GIT_SSH_KEY }}

      # Have cargo fetch git deps with the git CLI, which uses the ssh-agent and
      # known_hosts set up above. Set before Rust cache, whose `cargo metadata`
      # resolves git deps and whose cache key includes CARGO_* env vars.
      - name: Fetch git dependencies with the git CLI
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Parse and export environment variables
        run: |
          echo '${{ inputs.test-env-vars }}' | jq -r "to_entries|map(\"\(.key)=\(.value|tostring)\")|.[]" >> $GITHUB_ENV

      - name: Run Postgresql
        if: ${{ inputs.use-postgresql == true }}
        uses: ikalnytskyi/action-setup-postgres@v5

      - name: Install Rust ${{ inputs.rust-toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      # Before the cache step so RUSTFLAGS is part of the Swatinem cache key.
      - name: Set up mold linker
        if: ${{ inputs.use-mold }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mold clang
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C linker=clang -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          prefix-key: ${{ inputs.rust-cache-prefix }}
          shared-key: tests-suites
          save-if: ${{ inputs.rust-cache-save }}

      - name: Install Protoc
        if: ${{ inputs.install-protoc == true }}
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Suite
        run: cargo test --test ${{ matrix.element }}

  unused-dependencies:
    name: Unused Dependencies
    runs-on: ${{ inputs.run-label }}
    if: ${{ inputs.check-udeps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_ACCESS_TOKEN || github.token }}
          submodules: recursive

      # Opt-in (only when the caller provides CARGO_GIT_SSH_KEY): load the key into
      # an ssh-agent so private git dependencies can be fetched over SSH.
      - name: Load SSH key for private git dependencies
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.CARGO_GIT_SSH_KEY }}

      # Have cargo fetch git deps with the git CLI, which uses the ssh-agent and
      # known_hosts set up above. Set before Rust cache, whose `cargo metadata`
      # resolves git deps and whose cache key includes CARGO_* env vars.
      - name: Fetch git dependencies with the git CLI
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Install Rust ${{ inputs.rust-toolchain-udeps }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain-udeps }}

      - name: Rust cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          prefix-key: ${{ inputs.rust-cache-prefix }}
          shared-key: unused-deps
          save-if: ${{ inputs.rust-cache-save }}

      - name: Install cargo-udeps
        run: cargo install cargo-udeps@0.1.43 --locked

      - name: Check Dependencies
        run: cargo udeps --all-targets

  license:
    name: Licenses
    runs-on: ${{ inputs.run-label-light }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PRIVATE_SUBMODULE_ACCESS_TOKEN || github.token }}
          submodules: recursive
      - uses: EmbarkStudios/cargo-deny-action@v2
        # The action runs in a Docker container that can't see the runner's
        # ssh-agent, so callers with CARGO_GIT_SSH_KEY use the host path below.
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY != 'true' }}
        with:
          rust-version: ${{ inputs.rust-toolchain }}
          command: check licenses

      # Host path (opt-in, only when the caller provides CARGO_GIT_SSH_KEY). It
      # mirrors the container action above: same toolchain, same cargo-deny
      # version as cargo-deny-action@v2 ships, same arguments.
      - name: Load SSH key for private git dependencies
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.CARGO_GIT_SSH_KEY }}

      - name: Install Rust ${{ inputs.rust-toolchain }}
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Install cargo-deny
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        env:
          # Keep in sync with the `deny_version` in cargo-deny-action@v2's Dockerfile.
          CARGO_DENY_VERSION: '0.20.2'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              target=x86_64-unknown-linux-musl
              sha256=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
            aarch64|arm64)
              target=aarch64-unknown-linux-musl
              sha256=995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          name="cargo-deny-${CARGO_DENY_VERSION}-${target}"
          dir="$RUNNER_TEMP/cargo-deny"
          mkdir -p "$dir"
          curl -sSfL -o "$dir/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${sha256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/cargo-deny"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Check Licenses
        if: ${{ env.HAS_CARGO_GIT_SSH_KEY == 'true' }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          # Same as the action's entrypoint: honor a rust-toolchain.toml, then run
          # `cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check licenses`.
          rustup show || rustup toolchain install
          cargo-deny --log-level warn --manifest-path ./Cargo.toml --all-features check licenses
